<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalBoard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#f0f0f0;color:#222}
#app{display:flex;flex-direction:column;height:100%}
#toolbar{display:flex;align-items:center;gap:4px;padding:6px 10px;background:#fff;border-bottom:1px solid #ccc;flex-wrap:wrap;user-select:none;-webkit-user-select:none;z-index:10;min-height:44px}
#toolbar button{padding:5px 12px;border:1px solid #bbb;border-radius:4px;background:#fafafa;cursor:pointer;font-size:13px;white-space:nowrap}
#toolbar button:hover{background:#eaeaea}
#toolbar button.active{background:#d0d7ff;border-color:#4a6cf7;color:#4a6cf7;font-weight:600}
#toolbar button:disabled{opacity:.4;cursor:default}
#toolbar label{display:flex;align-items:center;gap:3px;font-size:13px;color:#555}
#toolbar input[type=color]{width:28px;height:28px;border:1px solid #bbb;border-radius:3px;padding:1px;cursor:pointer;background:none}
#toolbar input[type=range]{width:60px;cursor:pointer}
.separator{width:1px;height:24px;background:#ccc;margin:0 4px}
#canvas{flex:1;cursor:crosshair;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#canvas.panning{cursor:grab}
#canvas.grabbing{cursor:grabbing}
#text-editor{position:fixed;z-index:20;background:transparent;border:none;outline:none;padding:4px;font-family:system-ui,sans-serif;resize:none;overflow:hidden;min-width:20px;min-height:20px;display:none}
#ctx-menu{position:fixed;z-index:30;background:#fff;border:1px solid #bbb;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.15);padding:4px;display:none;min-width:120px}
#ctx-menu button{display:block;width:100%;padding:6px 12px;border:none;background:none;cursor:pointer;font-size:13px;text-align:left;border-radius:4px}
#ctx-menu button:hover{background:#e8ecff}
.ctx-sep{height:1px;background:#e0e0e0;margin:3px 4px}
#status{display:flex;justify-content:space-between;padding:3px 10px;background:#fff;border-top:1px solid #ccc;font-size:12px;color:#666}
</style>
</head>
<body>
<div id="app">
<div id="toolbar">
<button data-tool="select" class="active">Select</button>
<button data-tool="rectangle">Rect</button>
<button data-tool="ellipse">Oval</button>
<button data-tool="line">Line</button>
<button data-tool="freehand">Draw</button>
<button data-tool="text">Text</button>
<button data-tool="pan">Pan</button>
<div class="separator"></div>
<label>Stroke <input type="color" id="strokeColor" value="#1a1a2e"></label>
<label>Fill <input type="color" id="fillColor" value="#e2e2e2"></label>
<label>Width <input type="range" id="strokeWidth" min="1" max="20" value="3"></label>
<div class="separator"></div>
<button id="undo" disabled title="Undo (Ctrl+Z)">Undo</button>
<button id="redo" disabled title="Redo (Ctrl+Shift+Z)">Redo</button>
<button id="clear" title="Clear all">Clear</button>
</div>
<canvas id="canvas"></canvas>
<textarea id="text-editor"></textarea>
  <div id="ctx-menu">
    <button data-action="select">Select</button>
    <div class="ctx-sep"></div>
    <button data-action="delete">Delete</button>
  </div>
<div id="status"><span>LocalBoard v1</span><span id="status-info">Zoom: 100% | Elements: 0</span></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
